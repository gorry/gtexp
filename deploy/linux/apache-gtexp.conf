# G Timeline Explorer (gtexp) の Apache 設定例（Debian / Ubuntu）。gtexp.example.com は自分のホスト名に置き換える。
# /etc/apache2/sites-available/gtexp.conf にコピーして使う:
#   sudo a2enmod proxy proxy_http headers ssl rewrite
#   sudo a2ensite gtexp
#   sudo apachectl configtest && sudo systemctl reload apache2
#
# 証明書は certbot で取る（証明書がまだないうちは <VirtualHost *:443> の部分をコメントアウトしておく）:
#   sudo certbot certonly --apache -d gtexp.example.com   （取得後に 443 の部分のコメントを外して読み込み直す）

<VirtualHost *:80>
    ServerName gtexp.example.com
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName gtexp.example.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/gtexp.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/gtexp.example.com/privkey.pem

    # ---- プロキシ設定 ----
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8787/ timeout=600
    ProxyPassReverse / http://127.0.0.1:8787/
    # HTTPS で受けたことを Node 側に伝える（ログイン Cookie に Secure を付けるため）
    RequestHeader set X-Forwarded-Proto "https"
    # 取り込むファイルは gzip 後でも数十 MB になることがある
    LimitRequestBody 524288000

    ErrorLog  ${APACHE_LOG_DIR}/gtexp-error.log
    CustomLog ${APACHE_LOG_DIR}/gtexp-access.log combined
</VirtualHost>
</IfModule>
