# G Timeline Explorer (gtexp) の Apache 設定例（FreeBSD）。gtexp.example.com は自分のホスト名に置き換える。
# /usr/local/etc/apache24/Includes/gtexp.conf にコピーして使う。
# 必要なモジュール: proxy, proxy_http, headers, ssl, rewrite（httpd.conf で読み込んでおく）
#
# 証明書は certbot で取る（証明書がまだないうちは <VirtualHost *:443> の部分をコメントアウトしておく）:
#   sudo certbot certonly --apache -d gtexp.example.com   （取得後に 443 の部分のコメントを外して読み込み直す）

<VirtualHost *:80>
    ServerName gtexp.example.com
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule ssl_module>
<VirtualHost *:443>
    ServerName gtexp.example.com

    SSLEngine on
    SSLCertificateFile    /usr/local/etc/letsencrypt/live/gtexp.example.com/fullchain.pem
    SSLCertificateKeyFile /usr/local/etc/letsencrypt/live/gtexp.example.com/privkey.pem

    # ---- プロキシ設定 ----
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8787/ timeout=600
    ProxyPassReverse / http://127.0.0.1:8787/
    # HTTPS で受けたことを Node 側に伝える（ログイン Cookie に Secure を付けるため）
    RequestHeader set X-Forwarded-Proto "https"
    # 取り込むファイルは gzip 後でも数十 MB になることがある
    LimitRequestBody 524288000

    ErrorLog  /var/log/httpd/gtexp-error.log
    CustomLog /var/log/httpd/gtexp-access.log combined
</VirtualHost>
</IfModule>
