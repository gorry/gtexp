# G Timeline Explorer (gtexp) の nginx 設定例（FreeBSD）。gtexp.example.com は自分のホスト名に置き換える。
# /usr/local/etc/nginx/conf.d/gtexp.conf にコピーし、/usr/local/etc/nginx/nginx.conf の http { } の中に
# 次の 1 行がなければ足す:
#   include conf.d/*.conf;
# 読み込み直し:
#   sudo nginx -t && sudo service nginx reload
#
# 証明書は certbot で取る（証明書がまだないうちは listen 443 の server ブロックをコメントアウトしておく）:
#   sudo certbot certonly --nginx -d gtexp.example.com   （取得後に 443 の server ブロックのコメントを外して読み込み直す）

server {
    listen 80;
    listen [::]:80;
    server_name gtexp.example.com;

    location /.well-known/acme-challenge/ {
        root /usr/local/www/nginx;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gtexp.example.com;

    ssl_certificate     /usr/local/etc/letsencrypt/live/gtexp.example.com/fullchain.pem;
    ssl_certificate_key /usr/local/etc/letsencrypt/live/gtexp.example.com/privkey.pem;

    # 取り込むファイルは gzip 後でも数十 MB になることがある
    client_max_body_size 500m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        # HTTPS で受けたことを Node 側に伝える（ログイン Cookie に Secure を付けるため）
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 大きいファイルの取り込みは時間がかかる
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    access_log /var/log/nginx/gtexp-access.log;
    error_log  /var/log/nginx/gtexp-error.log;
}
